[package]
name = "reth-pipe-exec-layer-ext-v2"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "pipeline execution layer extension"

[lints]
workspace = true

[dependencies]
gravity-api-types.workspace = true
reth-pipe-exec-layer-event-bus.workspace = true
reth-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-evm-ethereum.workspace = true
reth-chainspec.workspace = true
reth-evm.workspace = true
reth-execution-types.workspace = true
reth-chain-state.workspace = true
reth-ethereum-primitives.workspace = true
reth-trie.workspace = true
reth-trie-parallel.workspace = true
reth-provider.workspace = true
reth-rpc-eth-api.workspace = true
revm-primitives.workspace = true
revm-interpreter.workspace = true
gravity-storage.workspace = true
gravity-primitives.workspace = true
gravity-precompiles.workspace = true
grevm.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-macro.workspace = true
alloy-sol-types.workspace = true
tokio.workspace = true
rayon.workspace = true

# ethereum
revm.workspace = true

# misc
tracing.workspace = true
parking_lot.workspace = true
reth-metrics.workspace = true
metrics.workspace = true
serde_json.workspace = true
once_cell.workspace = true
reth-pipe-exec-layer-relayer.workspace = true

# crypto and serialization for gravity-aptos validator_info
bcs = "0.1"
serde.workspace = true
hex = { version = "0.4.3", features = ["serde"] }
tiny-keccak = { version = "2.0", features = ["sha3"] }

[dev-dependencies]
reth-engine-primitives.workspace = true
reth-cli.workspace = true
reth-cli-commands.workspace = true
reth-cli-runner.workspace = true
reth-node-ethereum.workspace = true
reth-node-builder.workspace = true
reth-provider.workspace = true
reth-ethereum-cli.workspace = true
reth-ethereum-forks.workspace = true
reth-revm.workspace = true
reth-db.workspace = true
reth-node-api.workspace = true
reth-tracing.workspace = true
eyre.workspace = true
rand.workspace = true
criterion.workspace = true
hex-literal = "0.4"
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-rlp.workspace = true
alloy-genesis.workspace = true
alloy-rpc-types-trace.workspace = true
reth-trie = { workspace = true, features = ["test-utils"] }
ureq = { version = "2", features = ["json"] }
# difftx_fuzz：交易序列 property/fuzz 生成器（仅测试期）。
proptest = "1"

[features]
pipe_test = ["reth-provider/pipe_test"]
config-from-env = ["gravity-primitives/config-from-env"]
# 差分预言机（tx_filter ⊇ revm）：编译 difftx 模块与 difftx 工具二进制。
difftx = []
# serial ⟷ grevm 执行差分：编译 difftx_exec 模块与 difftx_exec 工具二进制。
difftx_exec = ["difftx"]

[[bench]]
name = "bls_pop_verify_bench"
harness = false

# 差分预言机命令行工具：跑 revm 变体覆盖矩阵 + 7702 执行诱导 TOCTOU 自检。
[[bin]]
name = "difftx"
path = "src/bin/difftx.rs"
required-features = ["difftx"]

# serial(revm) ⟷ grevm 执行差分预言机命令行工具：跑 baseline+adversarial 块，对比双后端。
[[bin]]
name = "difftx_exec"
path = "src/bin/difftx_exec.rs"
required-features = ["difftx_exec"]
