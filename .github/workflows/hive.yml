# Runs `ethereum/hive` rpc-compat tests for gravity-reth.

name: hive

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-rpc-compat:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout hive
        uses: actions/checkout@v5
        with:
          repository: ethereum/hive
          path: hive

      - uses: actions/setup-go@v5
        with:
          go-version: "^1.21"

      - name: Build hive
        run: |
          cd hive
          go build .

      - name: Setup gravity-reth client
        run: |
          mkdir -p hive/clients/gravity-reth

          # Copy reth client files as base
          cp hive/clients/reth/genesis.json hive/clients/gravity-reth/
          cp hive/clients/reth/mapper.jq hive/clients/gravity-reth/
          cp hive/clients/reth/enode.sh hive/clients/gravity-reth/

          # Create Dockerfile.local (Hive will build from source)
          cat > hive/clients/gravity-reth/Dockerfile.local << 'EOF'
          FROM rust:latest as builder
          ARG local_path=gravity-reth
          COPY $local_path gravity-reth
          RUN apt-get update && apt-get install -y libclang-dev pkg-config build-essential \
              && cd gravity-reth && cargo build --release \
              && cp target/release/reth /usr/local/bin/reth

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y bash curl jq ca-certificates \
              && apt-get clean && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /usr/local/bin/reth /usr/local/bin/reth
          COPY genesis.json /genesis.json
          COPY mapper.jq /mapper.jq
          COPY reth.sh /reth.sh
          COPY enode.sh /hive-bin/enode.sh
          RUN chmod +x /reth.sh /hive-bin/enode.sh /usr/local/bin/reth
          RUN echo "gravity-reth" > /version.txt
          EXPOSE 8545 8546 8551 30303 30303/udp
          ENTRYPOINT ["/reth.sh"]
          EOF

          # Create reth.sh with standalone mode
          cp hive/clients/reth/reth.sh hive/clients/gravity-reth/reth.sh
          # Append standalone mode flag
          sed -i 's/\$reth node \$FLAGS$/\$reth node \$FLAGS --gravity.disable-pipe-execution/' hive/clients/gravity-reth/reth.sh

          # Create hive.yaml
          cat > hive/clients/gravity-reth/hive.yaml << 'EOF'
          roles:
            - "eth1"
          EOF

          # Link source code
          ln -s ${{ github.workspace }} hive/clients/gravity-reth/gravity-reth

          # Create client config
          cat > hive/grevm-clients.yaml << 'EOF'
          - client: gravity-reth
            dockerfile: local
            nametag: gravity-reth-local
            build_args:
              local_path: gravity-reth
          EOF

      - name: Run rpc-compat tests
        run: |
          cd hive
          ./hive --sim ethereum/rpc-compat \
                 --client-file grevm-clients.yaml \
                 --sim.loglevel 3
        continue-on-error: true

      - name: Parse test results
        run: |
          cd hive
          echo "## Hive RPC-Compat Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          RESULT_FILE=$(ls -t workspace/logs/*.json 2>/dev/null | grep -v hive.json | head -1)
          
          if [ -n "$RESULT_FILE" ]; then
            TOTAL=$(jq '.testCases | length' "$RESULT_FILE")
            PASSED=$(jq '[.testCases[] | select(.summaryResult.pass == true)] | length' "$RESULT_FILE")
            FAILED=$((TOTAL - PASSED))
            
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-logs
          path: hive/workspace/logs/
          retention-days: 7

      - name: Print logs on failure
        if: failure()
        run: |
          cat hive/workspace/logs/*simulator*.log || true
          cat hive/workspace/logs/gravity-reth/client-*.log || true
