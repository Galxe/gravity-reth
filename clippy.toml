too-large-for-stack = 128
doc-valid-idents = [
    "P2P",
    "ExEx",
    "ExExes",
    "IPv4",
    "IPv6",
    "KiB",
    "MiB",
    "GiB",
    "TiB",
    "PiB",
    "EiB",
    "WAL",
    "MessagePack",
]
allow-dbg-in-tests = true
disallowed-methods = [
    { path = "alloy_evm::EvmInternals::db_mut", reason = "grevm custom precompiles must access EVM state through the journal-aware capability facade" },
]
